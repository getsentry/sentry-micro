name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository — it builds, tests and formats. Saying so
# explicitly means a compromised action in the toolchain cannot push a commit or open a
# release with the token GitHub hands every job by default.
permissions:
  contents: read

# A new push to a PR makes the in-flight run obsolete; toolchain downloads are slow
# enough that letting superseded runs finish is a real waste of CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned exactly: clang-format's output shifts between major versions, so an
      # unpinned one would fail this job on untouched files after any upgrade.
      - name: Install clang-format
        run: pip install clang-format==22.1.8
      - name: Check formatting
        run: scripts/format.sh --check

  test:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      # The portable core (C) and the portable transport code (C++, e.g. AutoTransport)
      # both build and run on the host, so this gate costs seconds and catches regressions
      # long before any board is involved. No -e: runs every native* environment, so a new
      # one added later is covered without this step needing to know its name.
      - name: Run tests
        run: pio test

      # The release scripts have no other safety net: everything they guard against —
      # an uncovered build variant, two variants sharing a debug id — fails silently in
      # production and only shows up as <unknown> frames weeks later.
      - name: Run release-script tests
        run: test/test_release/test_release_scripts.sh

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      # Report every broken variant in one run rather than one per push — the whole point
      # of the matrix is finding out that, say, only the RISC-V target regressed.
      fail-fast: false
      matrix:
        env: [esp32dev, esp32-s2, esp32-s3, esp32-c3, esp32-c6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Toolchains are hundreds of megabytes and identical between runs; keyed on the
      # platformio.ini that pins them so a version bump invalidates the cache.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ matrix.env }}-${{ hashFiles('examples/wifi_basic/platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build wifi_basic
        working-directory: examples/wifi_basic
        run: pio run -e ${{ matrix.env }}

  release-action:
    name: Release action (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-esp32dev-${{ hashFiles('examples/wifi_basic/platformio.ini') }}
          restore-keys: pio-esp32dev-

      # Exercises the whole release chain — fixpoint build, build-id stamp, and the
      # sentry-cli readback that proves the stamp landed — without publishing anything.
      # Otherwise the action is only ever run at release time, which is the worst moment
      # to discover it broke.
      #
      # One environment, not all five: the fixpoint builds each variant about three times,
      # and what is under test here is the action rather than the compiler.
      - uses: ./.github/actions/upload-debug-files
        id: release
        with:
          project-dir: examples/wifi_basic
          environments: esp32dev
          require-complete: false
          upload: false

      - name: Check the action reported a debug id
        run: |
          set -euo pipefail
          echo '${{ steps.release.outputs.variants }}' | python3 -c '
          import json, sys, uuid
          variants = json.load(sys.stdin)
          assert len(variants) == 1, variants
          # A malformed id would still round-trip through every step above and fail only
          # server-side, where nothing reports it back.
          uuid.UUID(variants[0]["debug_id"])
          assert variants[0]["image_addr"] == "0x3f400020", variants[0]
          print("ok:", variants[0]["debug_id"])
          '
