; sentry-micro — repository-level PlatformIO project.
;
; This file exists for the *host* unit tests, not for firmware. The portable core
; (`src/core/`) is deliberately freestanding C with no Arduino and no ESP-IDF, precisely so
; that DSN parsing, and later envelope construction, can be tested on a laptop in
; milliseconds instead of by flashing a board.
;
;   pio test -e native            -> run the host test suite
;
; Firmware builds live in the examples, each with its own platformio.ini:
;
;   cd examples/wifi_basic && pio run

[env:native]
platform = native
test_framework = unity

; Compile the portable core into the test binary. `src/device` and `src/transport` are
; excluded: they are chip-specific by definition and are covered by the per-variant
; compile check in examples/wifi_basic instead.
test_build_src = yes
build_src_filter = +<core/>

build_flags =
    -std=c99
    -Wall
    -Wextra
    -Werror
    -I src
    -I src/core
