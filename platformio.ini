; sentry-micro — repository-level PlatformIO project.
;
; This file exists for the *host* unit tests, not for firmware. The portable core
; (`src/core/`) is deliberately freestanding C with no Arduino and no ESP-IDF, precisely so
; that DSN parsing, and later envelope construction, can be tested on a laptop in
; milliseconds instead of by flashing a board.
;
;   pio test -e native            -> run the host test suite (portable C core)
;   pio test -e native_cxx        -> run the host test suite (portable C++ transport code)
;
; Firmware builds live in the examples, each with its own platformio.ini:
;
;   cd examples/wifi_basic && pio run

[env:native]
platform = native
test_framework = unity
; Scoped to this env's own tests: without it, `pio test` (no -e) would try to build the C++
; suite below under a C99-only environment. Each env stays isolated to what it can compile.
; One pattern per line — multi-value options collapse to nothing if space-separated instead.
test_filter =
    test_envelope
    test_dsn
    test_buffer
    test_relay
    test_throttle
    test_trace
    test_span
    test_metrics
    test_log

; Compile the portable core into the test binary. `src/device` and `src/transport` are
; excluded: they are chip-specific by definition and are covered by the per-variant
; compile check in examples/wifi_basic instead.
test_build_src = yes
build_src_filter = +<core/>

; test/test_release/ holds shell tests for the release scripts, which have no C to compile;
; without this PlatformIO tries to build the directory as a Unity suite and errors. CI runs
; them directly instead.
test_ignore = test_release

build_flags =
    -std=c99
    -Wall
    -Wextra
    -Werror
    -I src
    -I src/core

; `AutoTransport` (src/transport/sentry_transport_auto.hpp) is the one file in `transport/`
; with no Arduino or ESP-IDF dependency at all — it only calls the abstract `Transport`
; interface, so it is host-testable against fake transports, unlike its siblings
; (WiFi/Serial/RelayTransport), which the compile check in examples/wifi_basic covers
; instead. A separate env because it needs a C++ standard the [env:native] C core has no
; use for.
[env:native_cxx]
platform = native
test_framework = unity
test_filter = test_transport_auto

; No test_build_src / build_src_filter: everything under test is header-only (the
; Transport base class and AutoTransport are both fully inline), so there is no project
; source to compile in — only headers to find via the include path below.
build_flags =
    -std=c++14
    -Wall
    -Wextra
    -Werror
    -I src
    -I src/core
    -I src/transport
