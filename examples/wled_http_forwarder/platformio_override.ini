; sentry-micro — WLED HTTP-forwarder PoC
;
; Copy this file to the ROOT of a WLED checkout as `platformio_override.ini` — that is
; PlatformIO's own override mechanism (see WLED's platformio_override.sample.ini), so
; nothing in the WLED checkout itself needs to change. Then, from that checkout:
;
;   pio run -e sentry_poc -t upload -t monitor
;
; Layout: WLED cloned anywhere on disk, this file copied to its root as
; `platformio_override.ini`. No particular directory relationship to sentry-micro is
; required. The three references to this repo below (`extra_scripts`, `custom_usermods`,
; `lib_deps`) all resolve through one environment variable instead of a hardcoded path:
;
;   export SENTRY_MICRO_REPO=/path/to/sentry-micro
;
; The on-device DSN is not set here as a build_flag. Run http_forwarder.py with your
; project's real DSN, export its printed "device SENTRY_DSN" line as SENTRY_MICRO_DSN, and
; build — extra_scripts below turns that into the SENTRY_DSN macro, the same mechanism
; examples/wifi_basic uses. See this example's README for the full sequence, including
; scripts/release.sh, which needs that same variable set anyway to flash. With nothing set,
; the firmware falls back to a harmless placeholder DSN compiled into usermod_sentry.cpp.

; WLED's own platformio.ini sets a persistent, global build_cache_dir (~/.buildcache).
; That's fine for normal WLED development, but it bit us hard while iterating on
; sentry-micro source during this PoC: edits to a *symlinked* dependency didn't reliably
; invalidate the cache, serving stale objects across full `-t clean` rebuilds. Disabled
; here rather than globally, since it's a reasonable thing for WLED itself to want.
[platformio]
build_cache_dir =

[env:sentry_poc]
extends = env:esp32dev

; Same mechanism examples/wifi_basic uses (see that platformio.ini): turns SENTRY_MICRO_*
; environment variables into -D macros, so scripts/release.sh's build-id/debug-id/release
; reach this build without editing this file per run. ${sysenv.SENTRY_MICRO_REPO}, not a
; relative path like wifi_basic's `pre:../../scripts/env_secrets.py` — this project isn't
; inside the sentry-micro repo, so there's no fixed relative path to it. Unset, this
; resolves to an empty string rather than an error, so the build still fails, but with a
; generic PlatformIO dependency error that doesn't name this variable.
;
; Appended to WLED's own extra_scripts, not a bare assignment — a bare `extra_scripts =`
; here would replace rather than extend the inherited value, dropping
; pio-scripts/load_usermods.py (what makes custom_usermods work at all) along with
; everything else WLED's [scripts_defaults] wires in.
extra_scripts =
    ${env:esp32dev.extra_scripts}
    pre:${sysenv.SENTRY_MICRO_REPO}/scripts/env_secrets.py

; Overrides WLED's own platform pin (a Tasmota fork of platform-espressif32, Arduino core
; 3.3.8 / IDF 5.5.5) with sentry-micro's own tested one. Required, not just a precaution:
; the Tasmota fork's prebuilt Arduino core ships with CONFIG_ESP_COREDUMP_ENABLE_TO_NONE
; (not TO_FLASH) across its entire board matrix — baked into precompiled
; libespcoredump.a/libesp_system.a, so no build flag on our side can turn it back on.
; Without this override, sentry_coredump_is_supported() reports false at boot and every
; crash report degrades to a reset-reason-only message, no backtrace.
platform = espressif32@7.0.1

; The one existing coredump-capable partition table that fits a 4MB board — stock
; esp32dev has no coredump partition at all. WLED_ESP32_4MB_256KB_FS.csv reserves a 64K
; `coredump` partition. Necessary but not sufficient on its own — see the `platform`
; override above for the other half of this.
board_build.partitions = tools/WLED_ESP32_4MB_256KB_FS.csv

; `sentry` = our usermod, referenced by absolute path — never copied into WLED's own
; usermods/ folder. See pio-scripts/load_usermods.py's `LibName = <spec>` form.
custom_usermods =
    ${env:esp32dev.custom_usermods}
    sentry = symlink://${sysenv.SENTRY_MICRO_REPO}/examples/wled_http_forwarder/usermods/sentry

; sentry-micro itself, consumed the same way examples/wifi_basic does (symlink, not a
; copy) — so building this PoC against a local branch of the SDK just works.
lib_deps =
    ${env:esp32dev.lib_deps}
    symlink://${sysenv.SENTRY_MICRO_REPO}

build_flags =
    ${env:esp32dev.build_flags}
    ; No TLS anywhere on the device — the whole point of the HTTP-forwarder design.
    ; See src/transport/sentry_transport_wifi.hpp for what this compiles out.
    -D SENTRY_MICRO_WIFI_TLS=0
    -D SENTRY_MICRO_DEBUG=1
    ; DEBUG_PRINTLN/DEBUG_PRINTF (used by usermod_sentry.cpp) are no-ops without this —
    ; see wled00/wled.h.
    -D WLED_DEBUG
    ; esp32dev's shared [esp32_idf_V5] build_flags unconditionally set this, pulling a
    ; forked esp_dmx (github.com/netmindz/esp_dmx, "esp-idf-v5-fixes") written against
    ; IDF 5.x's dmx_config_t shape. Nothing to do with coredump — just a casualty of
    ; testing an older platform pin, undone the same way WLED's own ini undoes flags
    ; elsewhere (see -UWLED_USE_MY_CONFIG in platformio_override.sample.ini).
    -UWLED_ENABLE_DMX_INPUT

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
