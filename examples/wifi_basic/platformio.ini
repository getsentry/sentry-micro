; sentry-micro — wifi_basic example
;
; One env per ESP32 silicon family that runs the Arduino framework and has a WiFi radio.
; The library itself is chip-agnostic; these envs exist so that a change to the SDK can be
; compile-checked against every variant in one `pio run`, which is how a portable embedded
; SDK stays portable.
;
;   pio run                  -> build every default env (the four on the official platform)
;   pio run -e esp32dev      -> just classic ESP32
;   pio run -e esp32-c6      -> C6, via the community platform fork (see that env)
;   pio run -e esp32dev -t upload -t monitor
;
; Deliberately absent: ESP32-H2 (802.15.4/BLE only, no WiFi) and ESP8266 (different core
; entirely, no ESP-IDF coredump — noted as an extension in the proposal, not supported yet).

[platformio]
default_envs = esp32dev, esp32-s2, esp32-s3, esp32-c3


[env]
; Pinned, not floating. An unpinned platform silently changes the Arduino core — and with
; it the ESP-IDF version, the panic handler, and the coredump format — between two builds
; of the "same" firmware. For a crash-reporting SDK that is not a detail: the debug files
; uploaded for a release must match the binary that actually shipped.
platform = espressif32@7.0.1
framework = arduino

; Injects WIFI_SSID / WIFI_PASSWORD / SENTRY_DSN from SENTRY_MICRO_* environment variables
; when they are set, so real credentials never need to exist in a file. See the script.
extra_scripts = pre:../../scripts/env_secrets.py

monitor_speed = 115200
; Decodes a panic backtrace on the serial console using the local ELF. Handy while
; developing, and the thing sentry-micro is meant to replace once the board is in the field
; with no cable attached.
monitor_filters = esp32_exception_decoder, time

; The library under development, consumed exactly as a user would consume it — through its
; library.json, resolved by the LDF — rather than by reaching into ../../src. If the
; manifest is wrong, this build breaks, which is the point.
lib_deps = symlink://../..

build_flags =
    ; Arduino's WiFi + esp_log chatter at level 3 drowns the example's own output.
    -D CORE_DEBUG_LEVEL=1
    ; Turn on sentry-micro's own Serial narration in the example.
    -D SENTRY_MICRO_DEBUG=1

build_unflags =
    ; The ESP32 panic handler is what we ultimately hook; keep frame pointers so an
    ; unwind from a corrupted stack still produces usable PCs.
    -fomit-frame-pointer

; A partition table with a coredump partition — the default board tables do not have one,
; and without it `esp_core_dump_get_summary()` has nothing to read after a panic. 4 MB is
; the floor across these boards; on an 8/16 MB module this simply leaves the rest unused.
board_build.partitions = ../../partitions/sentry-coredump-4mb.csv
board_build.flash_size = 4MB


; ── Classic ESP32 (Xtensa LX6, dual core) ───────────────────────────────────
; WROOM/WROVER modules, PICO-D4. The overwhelming majority of WLED hardware.
[env:esp32dev]
board = esp32dev
; 115200, not the 921600 the newer parts use, because classic ESP32 boards sit behind an
; external USB-UART bridge of wildly varying quality. Verified on an M5Stack (FTDI FT232R,
; ESP32-PICO-D4): *any* baud change fails there — both 921600 and 460800 die with "Unable
; to verify flash chip connection (No serial data received)" immediately after esptool
; reports "Changed", while 115200 (no renegotiation at all) flashes reliably.
;
; The cost is real: ~53 s to upload rather than ~15 s. Reliability wins for an example that
; has to work on whatever board a maker already owns. Raise it locally if yours can take it.
upload_speed = 115200


; ── ESP32-S2 (Xtensa LX7, single core, native USB, no Bluetooth) ────────────
; WiFi-only part — so the WiFi transport is the *only* option here, which makes it a
; useful canary that the SDK does not quietly depend on BLE being present.
[env:esp32-s2]
board = esp32-s2-saola-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 921600


; ── ESP32-S3 (Xtensa LX7, dual core, native USB) ────────────────────────────
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 921600


; ── ESP32-C3 (RISC-V, single core, USB Serial/JTAG) ─────────────────────────
; First RISC-V target here: it exercises a different toolchain, a different backtrace
; format (no windowed registers), and a different panic dump layout than the Xtensa parts.
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    ; The C3's only USB is the built-in Serial/JTAG peripheral (HWCDC); without
    ; USB_MODE=1, `Serial` maps to a USB-OTG CDC this chip does not have.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 921600


; ── ESP32-C6 (RISC-V, WiFi 6) ───────────────────────────────────────────────
; Not in `default_envs`: platformio/espressif32 does not ship Arduino support for the C6,
; so this env pulls the community `pioarduino` fork, which does. That is a large extra
; toolchain download, so it stays opt-in — build it explicitly with `pio run -e esp32-c6`.
[env:esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 921600
