; sentry-micro — WLED browser-relay demo
;
; Copy this file to the ROOT of a WLED checkout as `platformio_override.ini` — that is
; PlatformIO's own override mechanism (see WLED's platformio_override.sample.ini), so
; nothing in the WLED checkout itself needs to change. Then, from that checkout:
;
;   pio run -e sentry_relay -t upload -t monitor
;
; The three references to this repo below (`extra_scripts`, `custom_usermods`, `lib_deps`)
; all resolve through one environment variable rather than a hardcoded path:
;
;   export SENTRY_MICRO_REPO=/path/to/sentry-micro
;
; Unlike this repo's other WLED example (examples/wled_http_forwarder), there is no
; separate process to run and no DSN rewriting: the device hands its finished request to
; whatever browser has the usermod's page open, and that browser performs the HTTPS POST.
; So SENTRY_MICRO_DSN here is your project's *real* DSN, unmodified.

; WLED's own platformio.ini sets a persistent, global build_cache_dir (~/.buildcache).
; Disabled here rather than globally: edits to a *symlinked* dependency (which is how
; sentry-micro is consumed below) don't reliably invalidate that cache, and it serves stale
; objects across full `-t clean` rebuilds. Fine for normal WLED development; not for this.
[platformio]
build_cache_dir =

[env:sentry_relay]
extends = env:esp32dev

; Same mechanism examples/wifi_basic uses (see that platformio.ini): turns SENTRY_MICRO_*
; environment variables into -D macros, so scripts/release.sh's build-id/debug-id/release
; reach this build without editing this file per run. ${sysenv.SENTRY_MICRO_REPO}, not a
; relative path like wifi_basic's `pre:../../scripts/env_secrets.py` — this project isn't
; inside the sentry-micro repo, so there's no fixed relative path to it.
;
; Appended to WLED's own extra_scripts, not a bare assignment — a bare `extra_scripts =`
; here would replace rather than extend the inherited value, dropping
; pio-scripts/load_usermods.py (what makes custom_usermods work at all) along with
; everything else WLED's [scripts_defaults] wires in.
extra_scripts =
    ${env:esp32dev.extra_scripts}
    pre:${sysenv.SENTRY_MICRO_REPO}/scripts/env_secrets.py

; WLED's *own* alternative platform, not a third-party pin: [esp32_idf_V5] in WLED's
; platformio.ini defines `platform_pioarduino` alongside the Tasmota fork it defaults to,
; and this switches to it. That matters because the Tasmota fork's prebuilt Arduino core
; ships CONFIG_ESP_COREDUMP_ENABLE_TO_NONE across its entire board matrix — baked into
; precompiled libespcoredump.a/libesp_system.a, so no build flag on our side turns it back
; on. The pioarduino core has CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=y, which is what makes a
; real backtrace possible. Without this line the firmware still reports crashes; they
; degrade to reset-reason-only, with no frames to symbolicate.
;
; WLED notes this platform "needs 300kB extra flash" — that is the actual price of a
; backtrace here, and it fits in the 1.8MB app partition below with room to spare.
platform = ${esp32_idf_V5.platform_pioarduino}
platform_packages = ${esp32_idf_V5.platform_packages_pioarduino}

; The one stock WLED partition table for a 4MB board that reserves a `coredump` partition
; (64K, see tools/WLED_ESP32_4MB_256KB_FS.csv). esp32dev's default has none at all, and
; without one the panic handler has nowhere to write — the `platform` override above is
; necessary but not sufficient on its own.
board_build.partitions = tools/WLED_ESP32_4MB_256KB_FS.csv

; `sentry` = our usermod, referenced by absolute path — never copied into WLED's own
; usermods/ folder. See pio-scripts/load_usermods.py's `LibName = <spec>` form.
;
; Deliberately NOT extending ${env:esp32dev.custom_usermods}, which is `audioreactive`: the
; platform override above costs ~300KB of flash and that is enough to push a stock esp32dev
; build past the 1.86MB app partition. Audioreactive is the cheapest thing to give back —
; WLED's own platformio.ini says it "crashes on classic esp32 (driver conflict related to
; legacy ADC)" on this very board, so nothing that worked here stops working. Put it back if
; you are building for an S3 with room to spare.
custom_usermods =
    sentry = symlink://${sysenv.SENTRY_MICRO_REPO}/examples/wled_browser_relay/usermods/sentry

; sentry-micro itself, consumed the same way examples/wifi_basic does (symlink, not a
; copy) — so building this demo against a local branch of the SDK just works.
lib_deps =
    ${env:esp32dev.lib_deps}
    symlink://${sysenv.SENTRY_MICRO_REPO}

build_flags =
    ${env:esp32dev.build_flags}
    ; No TLS anywhere in this firmware. Nothing in the usermod includes WiFiTransport, but
    ; PlatformIO compiles every .cpp in a library it links, so without this the mbedTLS
    ; that sentry_transport_wifi.cpp's WiFiClientSecure drags in is still in the image.
    ; See src/transport/sentry_transport_wifi.hpp for what this compiles out.
    -D SENTRY_MICRO_WIFI_TLS=0
    -D SENTRY_MICRO_DEBUG=1
    ; DEBUG_PRINTLN/DEBUG_PRINTF (used by usermod_sentry.cpp) are no-ops without this —
    ; see wled00/wled.h.
    -D WLED_DEBUG

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
